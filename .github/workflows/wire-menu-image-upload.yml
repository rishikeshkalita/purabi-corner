name: Wire menu image upload

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire image upload component
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/pos-app.tsx')
          text = path.read_text(encoding='utf-8')

          import_line = "import MenuManager from '@/components/menu-manager';\n"
          if import_line not in text:
              marker = "import { demoProducts, demoSales } from '@/lib/demo-data';\n"
              text = text.replace(marker, marker + import_line, 1)

          text = text.replace("function MenuManager({ products, setProducts, editing, setEditing }:", "function LegacyMenuManager({ products, setProducts, editing, setEditing }:", 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/pos-app.tsx
          git commit -m 'feat: wire direct product image upload'
          git push
