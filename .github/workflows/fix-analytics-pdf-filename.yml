name: Fix analytics PDF filename

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-filename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add report date to PDF filename
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/pos-app.tsx")
          text = path.read_text(encoding="utf-8")
          old = "`Purabi-Corner-Analytics-${modeLabel.replace(/\\s+/g, '-')}.pdf`"
          new = "`Purabi-Corner-Analytics-${modeLabel.replace(/\\s+/g, '-')}-${periodLabel.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '')}.pdf`"

          if old not in text:
              print("Filename already updated or pattern not found; no changes needed.")
          else:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pos-app.tsx
          git commit -m "fix: include report date in analytics PDF filename"
          git push
